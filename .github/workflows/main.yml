name: Deploy

on:
  push:

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check internal links and images
        uses: lycheeverse/lychee-action@v2
        with:
          # pinned so lychee.toml options don't break when the action bumps lychee
          lycheeVersion: v0.24.2
          args: --root-dir ${{ github.workspace }} --config lychee.toml './**/*.html'
          fail: true
          jobSummary: true

      - name: Check css url() and music player paths
        run: bash .github/scripts/check_asset_paths.sh

  build:
    needs: link-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Copy repository contents via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/var/www/html/l0r3z"

      - name: Execute remote command
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            pm2 status
